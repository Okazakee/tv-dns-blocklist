name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate derived files
        run: |
          python3 tools/build-strict.py
          python3 tools/build-pihole.py

      - name: Derived files must match the committed ones
        run: git diff --exit-code

      - name: Validate lists
        run: python3 tools/validate.py
